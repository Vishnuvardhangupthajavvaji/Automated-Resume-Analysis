{% extends "base.html" %}
{% block title %}Post a job · ResumeMatch{% endblock %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">Recruiter workspace</p>
  <h1>Post an opening</h1>

    {% csrf_token %}{{ form.as_p }}<button class="button" type="submit">Publish job</button>
  </form>
</section>
{% endblock %}
