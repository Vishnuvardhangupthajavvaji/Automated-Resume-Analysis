{% extends "base.html" %}
{% block title %}Log in · ResumeMatch{% endblock %}
{% block content %}
<section class="form-card narrow">
  <p class="eyebrow">Welcome back</p>
  <h1>Log in</h1>
  <form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}" />
  {% endif %}
  <button class="button" type="submit">Log in</button>
</form>
  <p>New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</section>
{% endblock %}
